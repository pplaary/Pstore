org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dhttps.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3
